apiVersion: v1
kind: Pod
metadata:
  name: tabicl-v7x-single-host
  namespace: default
  labels:
    app: tabicl-tpu-worker
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
spec:
  serviceAccountName: default
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  restartPolicy: Always
  nodeSelector:
    cloud.google.com/gke-nodepool: YOUR_TPU_V7X_NODEPOOL
    cloud.google.com/gke-tpu-accelerator: tpu7x
    cloud.google.com/gke-tpu-topology: 2x2x2
  tolerations:
  - key: "google.com/tpu"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "cloud.google.com/gke-queued"
    operator: "Exists"
    effect: "NoSchedule"
  containers:
  - name: worker
    image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/torchtpu/tabicl-torchtpu:v0.2.0-tabicl2.2.0
    imagePullPolicy: IfNotPresent
    command: ["/bin/bash", "-lc", "mkdir -p /workspace/run /tmp/torchtpu_compile_cache && sleep infinity"]
    env:
    - name: PJRT_DEVICE
      value: "TPU"
    - name: HF_HOME
      value: "/workspace/hf_cache"
    resources:
      requests:
        google.com/tpu: "4"
      limits:
        google.com/tpu: "4"
    volumeMounts:
    - name: dshm
      mountPath: /dev/shm
  volumes:
  - name: dshm
    emptyDir:
      medium: Memory
